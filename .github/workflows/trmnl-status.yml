name: Set TRMNL Office Status
on:
  workflow_dispatch:
    inputs:
      status_json:
        description: "Custom status settings (filled by the editor)"
        required: true
        type: string

# Serialize updates to the generated image branch.
concurrency:
  group: trmnl-office-status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install image renderer
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Generate custom sign
        env:
          STATUS_JSON: ${{ inputs.status_json }}
        run: node scripts/render-status.cjs
      - name: Publish image and send to TRMNL
        env:
          GH_TOKEN: ${{ github.token }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: python3 scripts/publish-status.py
