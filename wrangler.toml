[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/api/*"]

[vars]
APP_ORIGIN = "https://REPLACE-WITH-YOUR-WORKER.workers.dev"
GITHUB_CLIENT_ID = "REPLACE-WITH-OAUTH-CLIENT-ID"
