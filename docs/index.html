<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gilkey TRMNL Office Status</title>

    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 24px;
        background: #f6f7f9;
      }

      /* HEADER */
      .header {
        background: #0f172a;
        color: #ffffff;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
      }

      .header p {
        margin: 8px 0 14px;
        font-size: 14px;
        color: rgba(255,255,255,0.8);
      }

      .searchbar input {
        padding: 12px;
        width: 100%;
        max-width: 520px;
        border-radius: 10px;
        border: none;
        font-size: 14px;
      }

      /* AUTH ROW */
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }

      input {
        padding: 10px;
        width: min(520px, 100%);
      }

      button {
        padding: 10px 14px;
        cursor: pointer;
      }

      .status {
        margin-bottom: 14px;
        font-size: 13px;
      }

      /* SECTIONS */
      .section-title {
        margin-top: 26px;
        margin-bottom: 10px;
        font-size: 22px;
        font-weight: 800;
        color: #b42318;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 12px;
      }

      .card img {
        width: 100%;
        height: 140px;
        object-fit: contain;
        background: #fafafa;
        border-radius: 10px;
      }

      .name {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        margin-top: 8px;
        word-break: break-all;
      }
    </style>
  </head>

  <body>

    <!-- HEADER -->
    <div class="header">
      <h1>Gilkey TRMNL Office Status</h1>
      <p>
        Click a status image to update the TRMNL display.
        Username is fake (for your vault). Token stays in this browser.
      </p>

      <div class="searchbar">
        <input id="search" placeholder="Search statuses (office, brb, monday, studio...)" />
      </div>
    </div>

    <!-- AUTH -->
    <div class="row">
      <input id="username" placeholder="Username (anything)" />
      <input id="token" type="password" placeholder="Password (your GitHub token)" />
      <button id="unlock">Unlock</button>
      <button id="lock">Lock</button>
    </div>

    <div class="status" id="status"></div>

    <!-- CONTENT -->
    <div id="container"></div>

    <script>
      // NOTE: JS logic will be handled next step.
    </script>

  </body>
</html>
